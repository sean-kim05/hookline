# Disposable Postgres for running the queue conformance suite locally:
#
#   docker compose -f docker-compose.test.yml up -d
#   HOOKLINE_TEST_DATABASE_URL=postgres://hookline:hookline@localhost:5432/hookline go test ./...
#   docker compose -f docker-compose.test.yml down -v
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hookline
      POSTGRES_PASSWORD: hookline
      POSTGRES_DB: hookline
    ports:
      - "5432:5432"
