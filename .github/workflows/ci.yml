name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hookline
          POSTGRES_PASSWORD: hookline
          POSTGRES_DB: hookline
        ports:
          - 5432:5432
        # Wait for the database to accept connections before the job starts.
        options: >-
          --health-cmd "pg_isready -U hookline"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Drives the Postgres backend's conformance tests; unset locally they skip.
      HOOKLINE_TEST_DATABASE_URL: postgres://hookline:hookline@localhost:5432/hookline

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race -count=1 ./...
